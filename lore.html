<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Описательные абзацы</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    /* === ПЕРГАМЕНТНАЯ ТЕМА === */
    @font-face {
      font-family: 'Mookmania';
      src: url('fonts/Mookmania.otf') format('opentype');
    }
    @font-face {
      font-family: 'Nodesto';
      src: url('fonts/Nodesto.ttf') format('truetype');
    }

    :root {
      --parchment: #f3e9d2; --parchment-dark: #e3d5b8; --ink: #2c1e0e; --ink-light: #5a3e1e;
      --accent: #8b3a1a; --accent-gold: #b8860b; --border: #b89a6a; --shadow: rgba(0,0,0,0.2);
      --sidebar-width: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IM Fell English', Georgia, serif;
      background: #1a1208 url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M10 10 L 90 10 L 90 90 L 10 90 Z" fill="none" stroke="%238b5a2b" stroke-width="0.3" opacity="0.15"/><path d="M20 20 L 80 20 L 80 80 L 20 80 Z" fill="none" stroke="%238b5a2b" stroke-width="0.2" opacity="0.1"/></svg>');
      color: var(--ink); min-height: 100vh; line-height: 1.6;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #d9c6a6; }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
    .wrapper { display: flex; min-height: 100vh; }

    /* === БОКОВАЯ ПАНЕЛЬ === */
    .sidebar {
      width: var(--sidebar-width); background: #2e2416 url('data:image/svg+xml;utf8,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0 50 L 100 50 M50 0 L 50 100" stroke="%23b89a6a" stroke-width="0.5" opacity="0.1"/></svg>');
      color: #ecd59e; position: fixed; height: 100vh; overflow-y: auto; padding: 20px 0; z-index: 100;
      border-right: 3px solid var(--accent); box-shadow: 5px 0 15px var(--shadow);
      font-family: 'Cinzel', serif; transition: transform 0.25s ease;
    }
    .sidebar.closed { transform: translateX(-100%); }
    .sidebar h2 {
      padding: 0 20px 15px; font-size: 1.3rem; font-weight: 600; letter-spacing: 2px;
      border-bottom: 2px solid var(--accent-gold); margin-bottom: 15px; text-shadow: 2px 2px 0 #1a1208;
    }
    .sidebar .search-box { padding: 0 15px 15px; }
    .sidebar .search-box input {
      width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: #ecd59e; font-family: 'IM Fell English', serif; font-size: 0.9rem; outline: none;
    }
    .sidebar .search-box input::placeholder { color: #a08060; }
    .sidebar .search-box input:focus { border-color: var(--accent-gold); }
    .sidebar nav { padding: 0 10px; }

    /* Элементы списка */
    .nav-item {
      display: block; padding: 8px 15px; margin: 2px 0; color: #e0c090; text-decoration: none;
      font-size: 0.95rem; border-left: 3px solid transparent; transition: 0.2s;
      border-radius: 0 4px 4px 0; font-family: 'IM Fell English', serif;
      cursor: pointer;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(184, 134, 11, 0.2); color: #ffecb3; border-left-color: var(--accent-gold);
    }
    .nav-item.active { font-weight: bold; }

    /* === ОСНОВНАЯ ОБЛАСТЬ === */
    .main {
      margin-left: var(--sidebar-width); flex: 1; padding: 30px 40px 60px;
      max-width: 900px; background: transparent; transition: margin-left 0.25s ease;
    }
    .main.exp { margin-left: 0; }
    .header {
      margin-bottom: 30px; border-bottom: 2px solid var(--accent); padding-bottom: 15px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 {
      font-family: 'Nodesto', serif; font-size: 4rem; color: var(--ink-light);
      letter-spacing: 2px;
      text-shadow: 1px 1px 0px var(--parchment-dark);
    }
    .back-link {
      font-family: 'Mookmania', serif; font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--ink-light); text-decoration: none; border: 1px solid var(--border);
      padding: 5px 12px; transition: all 0.2s; background: var(--parchment);
    }
    .back-link:hover { color: var(--parchment-dark); border-color: var(--accent-gold); background-color: var(--ink); }
    .back-link::before { content: '← '; }

    /* Карточка текста */
    .text-card {
      background: var(--parchment); border: 2px solid var(--border); border-radius: 8px;
      padding: 30px; box-shadow: 8px 8px 0 var(--shadow);
    }
    .text-card h2 {
      font-family: 'Nodesto', serif; font-size: 2rem; color: var(--ink);
      border-bottom: 1px dashed var(--border); padding-bottom: 10px; margin-bottom: 20px;
    }
    .text-card .content {
      font-size: 1.05rem; 
      font-family: 'Mookmania';
      line-height: 1.8; 
      white-space: pre-wrap;
    }
    .text-card em {
      color: var(--text-hi);
      font-weight: bold;
      font-style: normal;
    .empty-message {
      text-align: center; color: var(--ink-light); font-style: italic; padding: 40px;
    }
  }
    .text-card i {
      color: var(--text-hi);
      font-style: italic;
    .empty-message {
      text-align: center; color: var(--ink-light); font-style: italic; padding: 40px;
    }
  }

    /* Гамбургер */
    .hamburger {
      display: none; position: fixed; top: 15px; left: 15px; z-index: 200;
      background: var(--parchment); border: 2px solid var(--accent); padding: 6px 10px;
      cursor: pointer; box-shadow: 3px 3px 0 var(--shadow); font-family: 'Mookmania'; font-size: 1.5rem; color: var(--ink);
    }

    @media (max-width: 768px) {
      .hamburger { display: block; }
      .sidebar { transform: translateX(-100%); width: 260px; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0 !important; padding: 20px; }
      .header { flex-direction: column; align-items: start; gap: 10px; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <button class="hamburger" id="hamburger">☰</button>
  <aside class="sidebar" id="sidebar">
    <h2>📜 Лор и описания</h2>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Поиск..."></div>
    <nav id="sidebar-nav"></nav>
  </aside>
  <main class="main" id="main">
    <div class="header">
      <h1>Описательные абзацы</h1>
      <a class="back-link" href="index.html">Назад</a>
    </div>
    <div id="content-container">
      <div class="text-card"><div class="empty-message">Выберите абзац из списка слева</div></div>
    </div>
  </main>
</div>
<script>
  (function() {
    const sidebar = document.getElementById('sidebar');
    const navContainer = document.getElementById('sidebar-nav');
    const content = document.getElementById('content-container');
    const searchInput = document.getElementById('searchInput');
    let entries = [];

    fetch('data/lore.json')
      .then(r => r.json())
      .then(data => {
        entries = data.entries;
        renderNav();
        // показать первый при загрузке
        if (entries.length) showEntry(entries[0].id);
      })
      .catch(e => console.error('Ошибка загрузки lore.json', e));

    function renderNav() {
      navContainer.innerHTML = entries.map(e => 
        `<a class="nav-item" data-id="${e.id}" href="#${e.id}">${e.title}</a>`
      ).join('');
      document.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', e => {
          e.preventDefault();
          showEntry(el.dataset.id);
          if (window.innerWidth <= 768) sidebar.classList.remove('open');
        });
      });
    }

    function showEntry(id) {
      const entry = entries.find(e => e.id === id);
      if (!entry) return;
      
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`.nav-item[data-id="${id}"]`)?.classList.add('active');
      
      content.innerHTML = `
        <div class="text-card">
          <h2>${entry.title}</h2>
          <div class="content">${entry.text}</div>
        </div>
      `;
      history.pushState(null, null, `#${id}`);
    }

    // Поиск
    searchInput.addEventListener('input', e => {
      const t = e.target.value.toLowerCase();
      document.querySelectorAll('.nav-item').forEach(el => {
        const title = el.textContent.toLowerCase();
        el.style.display = title.includes(t) ? 'block' : 'none';
      });
    });

    // Гамбургер
    document.getElementById('hamburger').addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Закрыть меню при клике вне (мобильные)
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 && !sidebar.contains(e.target) && !hamburger.contains(e.target)) {
        sidebar.classList.remove('open');
      }
    });

    // Восстановление из хеша
    window.addEventListener('popstate', () => {
      const hash = location.hash.slice(1);
      if (hash) showEntry(hash);
    });
  })();
</script>
</body>
</html>
